<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      font: 14px/1.45 "Segoe UI", Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand-icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #1e293b;
      font-size: 21px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #a7b4c5;
      font-size: 12px;
    }

    .card {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid #28364a;
      border-radius: 12px;
      background: #172235;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-title {
      display: block;
      font-weight: 600;
    }

    .setting-help {
      display: block;
      margin-top: 3px;
      color: #9eacbf;
      font-size: 12px;
    }

    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 1px solid #526176;
      border-radius: 999px;
      background: #334155;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease;
    }

    .switch-track::before {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      content: "";
      transition: transform .16s ease;
    }

    .switch input:checked + .switch-track {
      border-color: #22c55e;
      background: #16a34a;
    }

    .switch input:checked + .switch-track::before {
      transform: translateX(18px);
    }

    .switch input:focus-visible + .switch-track,
    select:focus-visible,
    input[type="range"]:focus-visible,
    button:focus-visible {
      outline: 2px solid #86efac;
      outline-offset: 3px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #dce5f0;
      font-size: 12px;
      font-weight: 600;
    }

    select {
      width: 100%;
      min-height: 40px;
      padding: 0 11px;
      border: 1px solid #3c4b60;
      border-radius: 8px;
      background: #101827;
      color: #f8fafc;
      font: inherit;
    }

    .zoom-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .zoom-heading .field-label {
      margin: 0;
    }

    output {
      color: #86efac;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      display: block;
      width: 100%;
      height: 20px;
      margin: 0;
      accent-color: #22c55e;
      cursor: pointer;
    }

    .range-limits {
      display: flex;
      justify-content: space-between;
      color: #9eacbf;
      font-size: 11px;
    }

    .primary {
      width: 100%;
      min-height: 44px;
      margin-top: 2px;
      border: 0;
      border-radius: 9px;
      background: #16a34a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }

    .primary:hover { background: #15803d; }
    .primary:active { transform: translateY(1px); }

    #status {
      min-height: 0;
      margin: 0;
      color: #fbbf24;
      font-size: 12px;
    }

    #status:not(:empty) {
      margin-top: 10px;
      padding: 9px 10px;
      border: 1px solid #854d0e;
      border-radius: 8px;
      background: #422006;
    }

    .footer {
      margin: 13px 2px 0;
      color: #a7b4c5;
      font-size: 11px;
      line-height: 1.55;
    }

    kbd {
      padding: 1px 5px;
      border: 1px solid #526176;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font: inherit;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand-icon" aria-hidden="true">🔍</div>
    <div>
      <h1>FUO Image Magnifier</h1>
      <p class="subtitle">Phóng to vùng câu hỏi trên fuoverflow.com</p>
    </div>
  </header>

  <section class="card setting-row" aria-label="Trạng thái tiện ích">
    <div>
      <span class="setting-title">Bật kính lúp</span>
      <span class="setting-help">Hiện hoặc ẩn khung phóng đại</span>
    </div>
    <label class="switch">
      <input id="enabled" type="checkbox" aria-label="Bật kính lúp">
      <span class="switch-track" aria-hidden="true"></span>
    </label>
  </section>

  <section class="card">
    <label class="field-label" for="mode">Vị trí vùng phóng đại</label>
    <select id="mode">
      <option value="fixed">Cố định vùng đã chọn</option>
      <option value="follow">Theo vị trí con trỏ</option>
    </select>
  </section>

  <section class="card">
    <div class="zoom-heading">
      <label class="field-label" for="zoom">Mức phóng đại</label>
      <output id="zoomText" for="zoom">2.5×</output>
    </div>
    <input id="zoom" type="range" min="1.5" max="8" step="0.1" aria-label="Mức phóng đại">
    <div class="range-limits" aria-hidden="true">
      <span>1.5×</span>
      <span>Bước 0.1×</span>
      <span>8×</span>
    </div>
  </section>

  <button id="selectRegion" class="primary" type="button">▣ &nbsp; Chọn vùng câu hỏi</button>
  <p id="status" role="status" aria-live="polite"></p>

  <p class="footer">
    Nhấn nút rồi kéo chuột bao quanh câu hỏi và đáp án. Vùng chọn được giữ lại khi chuyển ảnh.
    Dùng <kbd>Alt</kbd> + <kbd>M</kbd> để bật hoặc tắt nhanh.
  </p>
  <script src="popup.js"></script>
</body>
</html>
